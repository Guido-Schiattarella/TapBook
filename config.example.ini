; OPTIONAL configuration: without config.ini the app starts with these values.
; To change them, copy this file to config.ini. Every value can also be
; overridden with a NOTES_<NAME> environment variable (e.g. NOTES_PORT).

[server]
; 0.0.0.0 = reachable from the local network (needed for the iPad)
host = 0.0.0.0
port = 8000
; folder containing one subfolder per user
notes_root = ~/Note
; internal data: session key, page cache, user database (SQLite), certificates
; (default on Windows: %LOCALAPPDATA%\TapBook)
data_dir = ./instance
session_hours = 12
max_upload_mb = 100
; true = anyone on the network can create an account from the login page
; (the first account can always be created)
allow_registration = true
; minutes without changes after which a document open on the iPad is saved and
; closed; writing again reopens it from the version on disk
edit_idle_minutes = 15
; true = encrypted connection (HTTPS) with certificates created by the app in
; data_dir/tls; the certificate is installed once on the iPad from the login page
https = true
; auto = with an active firewall (ufw, firewalld, nftables, iptables, Shorewall,
;        ferm… or Windows Defender Firewall) the port opens automatically, only for
;        the local network and only while the server is running; the administrator
;        password is asked at every start, nothing is installed and no sudo rule is added
; on   = like auto, even when the firewall is not detected (systems without
;        systemd, rules loaded by custom scripts)
; off  = the firewall is never touched
firewall = auto
; true = when it opens, the control panel checks GitHub for a newer version
;        (a single request, no data sent, nothing is downloaded automatically)
update_check = true
; Releases repository ("owner/name"); empty = the one built into the app
update_repository =

[database]
; No settings: users live in an SQLite database (data_dir/tapbook.db) created
; automatically on first start. Users of earlier versions, which used MariaDB
; (data_dir/mysql), are copied over automatically on first start.
